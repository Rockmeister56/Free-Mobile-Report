<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Locked Sites</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial; background: #0a0a0a; color: white; padding: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #333; }
        th { background: #0066cc; }
        .remove-btn { background: #cc4444; color: white; border: none; padding: 5px 10px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>🔐 Locked Websites</h1>
    <div id="sitesList"></div>

    <script>
        const SUPABASE_URL = 'https://fcgbusobfdwnpoqyuzoe.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZjZ2J1c29iZmR3bnBvcXl1em9lIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAzNDA2MjMsImV4cCI6MjA4NTkxNjYyM30.FHEZnxuGHSn_Z3gw9d_Txtfz5Jn55J6qonl8rnA3gPk';
        
        const { createClient } = supabase;
        const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function loadSites() {
            const { data, error } = await supabaseClient
                .from('audited_sites')
                .select('*')
                .order('audited_at', { ascending: false });
            
            if (error) {
                document.getElementById('sitesList').innerHTML = 'Error: ' + error.message;
                return;
            }
            
            let html = '<table><tr><th>Domain</th><th>Date</th><th>Action</th></tr>';
            
            if (data && data.length > 0) {
                data.forEach(site => {
                    html += `<tr>
                        <td>${site.domain}</td>
                        <td>${new Date(site.audited_at).toLocaleDateString()}</td>
                        <td><button class="remove-btn" onclick="removeSite('${site.domain}')">Remove</button></td>
                    </tr>`;
                });
            } else {
                html += '<tr><td colspan="3">No locked sites</td></tr>';
            }
            
            html += '</table>';
            document.getElementById('sitesList').innerHTML = html;
        }
        
        async function removeSite(domain) {
            if (confirm('Remove ' + domain + '?')) {
                await supabaseClient.from('audited_sites').delete().eq('domain', domain);
                loadSites();
            }
        }
        
        window.removeSite = removeSite;
        loadSites();
    </script>
</body>
</html>
