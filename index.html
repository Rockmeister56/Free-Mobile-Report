<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Mobile Audit - Is Your Mobile Site Costing You Sales?</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Full-width header with your image as background -->
    <div class="header-background">
        <div class="container">
            <div class="header-content">
                <!-- Hero Section -->
                <header class="hero">
                    <h1>Is your mobile site costing you.. <span class="highlight">SALES LEADS?</span></h1>
                    <p class="stats">Most businesses lose <strong>70% of mobile visitors</strong> due to poor mobile experience</p><br>
                   <div>
                   <br><p class="subtitle"><h2>Get Your FREE Mobile Conversion Score!</p></h2>
                   </div>
                </header>

                <!-- Audit Form -->
                <section class="audit-form">
                    <div class="form-container">
                        <input 
                            type="url" 
                            id="websiteUrl" 
                            placeholder="Enter your website URL (e.g., https://yoursite.com)" 
                            class="url-input"
                        >
                        <button id="analyzeBtn" class="analyze-btn">
                            🔍 ANALYZE MOBILE WEBSITE
                        </button>
                    </div>
                </section>

                <!-- Benefits -->
                <section class="benefits-section">
                    <div class="benefits">
                        <div class="benefit">✓ Results in 30 seconds</div>
                        <div class="benefit">✓ See what's hurting your conversions</div>
                        <div class="benefit">✓ Get actionable solutions</div>
                    </div>
                </section>
            </div>
        </div>
    </div>

    <!-- Rest of your content can go here if needed -->
    <div class="main-content">
        <div class="container">
            <!-- Additional content can go here -->
        </div>
    </div>

    <!-- Footer Section -->
    <footer class="main-footer">
        <div class="footer-container">
            <img src="https://odetjszursuaxpapfwcy.supabase.co/storage/v1/object/public/form-assets/logos/logo_5f42f026-051a-42c7-833d-375fcac74252_1761017228936_footer2.jpg" 
                 alt="Mobile-Wise AI Footer" 
                 class="footer-image">
        </div>
    </footer>

    <script src="app.js"></script>
    <!-- MOBILEWISE AI IFRAME INTEGRATION -->
<iframe src="mobilewise-ai-interface.html" 
        id="mobilewiseAIIframe"
        style="position: fixed; 
               bottom: 20px; 
               right: 20px; 
               width: 497px; 
               height: 533px; 
               border: none; 
               border-radius: 20px; 
               box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
               z-index: 9999;
               display: none; /* Hidden initially */
               overflow: hidden;">
</iframe>

<!-- OVERLAY CONTAINERS (in parent window) -->
<div id="mobilewiseParentOverlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 9998; display: none; backdrop-filter: blur(5px);"></div>

<div id="mobilewiseParentInterface" style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 90vw; max-width: 900px; height: 80vh; background: white; border-radius: 20px; z-index: 9999; display: none; box-shadow: 0 25px 60px rgba(0,0,0,0.4);">
    <button id="mobilewiseParentCloseBtn" style="position: absolute; top: 20px; right: 20px; background: #002fff; color: white; border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; z-index: 10000; font-size: 24px;">×</button>
    <iframe id="mobilewiseParentChatIframe" src="" style="width: 100%; height: 100%; border: none; border-radius: 20px;" allow="microphone; camera"></iframe>
</div>

<script>
    // Show AI interface after delay
    setTimeout(() => {
        document.getElementById('mobilewiseAIIframe').style.display = 'block';
    }, 2000); // Show after 2 seconds
    
    // Listen for messages from the iframe
    window.addEventListener('message', function(event) {
        if (event.data.type === 'OPEN_MOBILEWISE_OVERLAY') {
            // Show overlay and voice chat
            document.getElementById('mobilewiseParentOverlay').style.display = 'block';
            document.getElementById('mobilewiseParentInterface').style.display = 'block';
            document.getElementById('mobilewiseParentChatIframe').src = event.data.url;
            
            // Hide the floating AI button
            document.getElementById('mobilewiseAIIframe').style.display = 'none';
        }
        
        if (event.data.type === 'HIDE_MOBILEWISE_IFRAME') {
            // Hide the floating AI button
            document.getElementById('mobilewiseAIIframe').style.display = 'none';
        }
    });
    
    // Close overlay functionality
    document.getElementById('mobilewiseParentCloseBtn').addEventListener('click', closeMobilewiseOverlay);
    document.getElementById('mobilewiseParentOverlay').addEventListener('click', closeMobilewiseOverlay);
    
    function closeMobilewiseOverlay() {
        document.getElementById('mobilewiseParentOverlay').style.display = 'none';
        document.getElementById('mobilewiseParentInterface').style.display = 'none';
        document.getElementById('mobilewiseParentChatIframe').src = '';
        
        // Show the floating AI button again after a delay
        setTimeout(() => {
            document.getElementById('mobilewiseAIIframe').style.display = 'block';
        }, 1000);
    }
    
    // Escape key to close overlay
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && document.getElementById('mobilewiseParentOverlay').style.display === 'block') {
            closeMobilewiseOverlay();
        }
    });
</script>
</body>
</html>
