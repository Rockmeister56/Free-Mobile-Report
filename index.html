<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Mobile Audit - Is Your Mobile Site Costing You Sales?</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Full-width header with your image as background -->
    <div class="header-background">
        <div class="container">
            <div class="header-content">
                <!-- Hero Section -->
                <header class="hero">
                    <h1>Is your mobile site costing you.. <span class="highlight">SALES LEADS?</span></h1>
                    <p class="stats">Most businesses lose <strong>70% of mobile visitors</strong> due to poor mobile experience</p><br>
                   <div>
                   <br><p class="subtitle"><h2>Get Your FREE Mobile Conversion Score!</p></h2>
                   </div>
                </header>

                <!-- Audit Form -->
                <section class="audit-form">
                    <div class="form-container">
                        <input 
                            type="url" 
                            id="websiteUrl" 
                            placeholder="Enter your website URL (e.g., https://yoursite.com)" 
                            class="url-input"
                        >
                        <button id="analyzeBtn" class="analyze-btn">
                            🔍 ANALYZE MOBILE WEBSITE
                        </button>
                    </div>
                </section>

                <!-- Benefits -->
                <section class="benefits-section">
                    <div class="benefits">
                        <div class="benefit">✓ Results in 30 seconds</div>
                        <div class="benefit">✓ See what's hurting your conversions</div>
                        <div class="benefit">✓ Get actionable solutions</div>
                    </div>
                </section>
            </div>
        </div>
    </div>

    <!-- Rest of your content can go here if needed -->
    <div class="main-content">
        <div class="container">
            <!-- Additional content can go here -->
        </div>
    </div>

    <!-- Footer Section -->
    <footer class="main-footer">
        <div class="footer-container">
            <img src="https://odetjszursuaxpapfwcy.supabase.co/storage/v1/object/public/form-assets/logos/logo_5f42f026-051a-42c7-833d-375fcac74252_1761017228936_footer2.jpg" 
                 alt="Mobile-Wise AI Footer" 
                 class="footer-image">
        </div>
    </footer>

    <script src="app.js"></script>
    <!-- MOBILEWISE AI WIDGET - 400x430 -->
<div id="mobilewiseAIWidget" style="position: fixed; bottom: -500px; right: 20px; width: 400px; height: 430px; z-index: 10000; transition: bottom 0.8s ease-out;">
    <!-- Main Container -->
    <div style="width: 100%; height: 100%; position: relative;">
        
        <!-- Video Window -->
        <div style="position: absolute; top: 100px; left: 60px; width: 280px; height: 160px; border-radius: 10px; overflow: hidden; background: black;">
            <video autoplay muted playsinline loop style="width: 100%; height: 100%; object-fit: cover;">
                <source src="https://odetjszursuaxpapfwcy.supabase.co/storage/v1/object/public/video-avatars/video_avatar_1764286430873.mp4" type="video/mp4">
            </video>
        </div>
        
        <!-- Text Area -->
        <div style="position: absolute; bottom: 145px; left: 40px; right: 40px; text-align: center;">
            <div id="aiMessageWidget" style="background: rgba(0,0,0,0.9); color: white; padding: 12px 15px; border-radius: 10px; font-size: 14px; min-height: 60px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); font-family: Arial, sans-serif;">
                Loading AI Assistant...
            </div>
        </div>
        
        <!-- Buttons -->
        <div style="position: absolute; bottom: 70px; left: 40px; right: 40px; display: flex; flex-direction: column; gap: 8px;">
            <button id="getAssistanceBtn" style="padding: 13px; background: linear-gradient(135deg, #002fff 0%, #060a1c 100%); color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 15px rgba(0,47,255,0.3);">
                Get AI Assistance ▶
            </button>
            <button id="justBrowsingBtn" style="padding: 13px; background: white; color: #333; border: 2px solid #002fff; border-radius: 10px; font-size: 15px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
                Just Browsing 👉
            </button>
        </div>
        
        <!-- Overlay Image -->
        <img src="https://odetjszursuaxpapfwcy.supabase.co/storage/v1/object/public/form-assets/logos/logo_5f42f026-051a-42c7-833d-375fcac74252_1764359060407_player3.png" 
             style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; border-radius: 15px;">
    </div>
</div>

<!-- OVERLAY CONTAINERS -->
<div id="mobilewiseOverlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 9998; display: none;"></div>

<div id="mobilewiseVoiceInterface" style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 90vw; max-width: 900px; height: 80vh; background: white; border-radius: 20px; z-index: 9999; display: none; box-shadow: 0 25px 60px rgba(0,0,0,0.4);">
    <button id="mobilewiseCloseBtn" style="position: absolute; top: 20px; right: 20px; background: #002fff; color: white; border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; z-index: 10000; font-size: 24px;">×</button>
    <iframe id="voiceChatIframe" src="" style="width: 100%; height: 100%; border: none; border-radius: 20px;" allow="microphone"></iframe>
</div>

<script>
    console.log('MobileWise AI Script Loading...');
    
    // Simple text typing animation
    function typeText(elementId, text) {
        const element = document.getElementById(elementId);
        element.innerHTML = '';
        let i = 0;
        
        function type() {
            if (i < text.length) {
                element.innerHTML = text.substring(0, i + 1) + '|';
                i++;
                setTimeout(type, 50);
            } else {
                element.innerHTML = text;
            }
        }
        type();
    }
    
    // Show the widget
    setTimeout(function() {
        console.log('Showing MobileWise AI Widget');
        const widget = document.getElementById('mobilewiseAIWidget');
        widget.style.bottom = '20px';
        
        // Start typing animation
        setTimeout(function() {
            typeText('aiMessageWidget', "Hi! I'm your MobileWise AI Assistant.");
        }, 500);
        
    }, 2000); // Show after 2 seconds
    
    // Get AI Assistance Button
    document.getElementById('getAssistanceBtn').addEventListener('click', function() {
        console.log('Get AI Assistance clicked');
        
        const originalText = this.innerHTML;
        this.innerHTML = 'Opening...';
        this.disabled = true;
        
        // Show overlay
        document.getElementById('mobilewiseOverlay').style.display = 'block';
        document.getElementById('mobilewiseVoiceInterface').style.display = 'block';
        
        // Set iframe URL
        const timestamp = Date.now();
        const voiceChatUrl = `https://smartaivoicebot.netlify.app/voice-chat-fusion-instant?autoStartVoice=true&mobilewiseMode=true&timestamp=${timestamp}`;
        document.getElementById('voiceChatIframe').src = voiceChatUrl;
        
        // Hide widget
        document.getElementById('mobilewiseAIWidget').style.bottom = '-500px';
        
        // Reset button
        setTimeout(() => {
            this.innerHTML = originalText;
            this.disabled = false;
        }, 1000);
    });
    
    // Just Browsing Button
    document.getElementById('justBrowsingBtn').addEventListener('click', function() {
        console.log('Just Browsing clicked');
        document.getElementById('mobilewiseAIWidget').style.bottom = '-500px';
    });
    
    // Close overlay
    document.getElementById('mobilewiseCloseBtn').addEventListener('click', function() {
        closeOverlay();
    });
    
    document.getElementById('mobilewiseOverlay').addEventListener('click', function() {
        closeOverlay();
    });
    
    function closeOverlay() {
        document.getElementById('mobilewiseOverlay').style.display = 'none';
        document.getElementById('mobilewiseVoiceInterface').style.display = 'none';
        document.getElementById('voiceChatIframe').src = '';
        
        // Show widget again after delay
        setTimeout(() => {
            document.getElementById('mobilewiseAIWidget').style.bottom = '20px';
        }, 1000);
    }
    
    // Escape key to close
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && document.getElementById('mobilewiseOverlay').style.display === 'block') {
            closeOverlay();
        }
    });
    
    console.log('MobileWise AI Script Loaded');
</script>
</body>
</html>
