<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Mobile Audit - Is Your Mobile Site Costing You Sales?</title>
    <style>
        /* BASE STYLES */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f7fa;
            color: #333;
            line-height: 1.6;
            position: relative;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* HEADER SECTION */
        .header-background {
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)),
                        url('https://odetjszursuaxpapfwcy.supabase.co/storage/v1/object/public/form-assets/logos/logo_5f42f026-051a-42c7-833d-375fcac74252_1763890085630_attachment.jpg') no-repeat center center;
            background-size: cover;
            color: white;
            padding: 80px 0 60px;
            position: relative;
        }

        .header-content {
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
        }

        .hero h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            line-height: 1.2;
            font-weight: 700;
        }

        .highlight {
            color: #4CAF50;
            background: rgba(76, 175, 80, 0.1);
            padding: 0 10px;
            border-radius: 5px;
        }

        .stats {
            font-size: 1.3rem;
            margin-bottom: 30px;
            color: #e0e0e0;
        }

        .stats strong {
            color: #4CAF50;
        }

        .subtitle {
            font-size: 1.8rem;
            margin: 40px 0 30px;
            color: #fff;
        }

        .subtitle h2 {
            font-size: inherit;
            font-weight: 600;
        }

        /* AUDIT FORM */
        .audit-form {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 40px;
            margin: 40px auto;
            max-width: 700px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .form-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .url-input {
            padding: 20px 25px;
            font-size: 1.1rem;
            border: 2px solid #4CAF50;
            border-radius: 10px;
            background: white;
            color: #333;
            transition: all 0.3s ease;
        }

        .url-input:focus {
            outline: none;
            border-color: #2E7D32;
            box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.3);
        }

        .analyze-btn {
            padding: 20px 30px;
            font-size: 1.2rem;
            font-weight: 600;
            background: linear-gradient(135deg, #4CAF50 0%, #2E7D32 100%);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .analyze-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(76, 175, 80, 0.4);
            background: linear-gradient(135deg, #43A047 0%, #1B5E20 100%);
        }

        /* BENEFITS SECTION */
        .benefits-section {
            margin: 40px 0;
        }

        .benefits {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 30px;
            max-width: 800px;
            margin: 0 auto;
        }

        .benefit {
            background: rgba(76, 175, 80, 0.15);
            padding: 15px 25px;
            border-radius: 50px;
            font-size: 1.1rem;
            color: white;
            border: 1px solid rgba(76, 175, 80, 0.3);
        }

        /* FOOTER */
        .main-footer {
            background: #1a1a1a;
            padding: 40px 0;
            text-align: center;
        }

        .footer-image {
            max-width: 300px;
            height: auto;
            border-radius: 10px;
        }

        /* MOBILEWISE AI BUTTON STYLES */
        .ai-button-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: auto;
            display: flex;
            justify-content: flex-end;
            z-index: 1000;
            transform: translateX(100px);
            opacity: 0;
            transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .ai-button-container.show {
            transform: translateX(0);
            opacity: 1;
        }

        .ai-button-wrapper {
            width: 300px;
            position: relative;
        }

        .ai-video {
            width: 100%;
            height: auto;
            border-radius: 15px;
            position: relative;
            z-index: 1;
            transform: scale(0.9);
            transform-origin: center center;
        }

        .ai-button-overlay {
            width: 100%;
            height: auto;
            border-radius: 15px;
            box-shadow: 0 8px 35px rgba(0,0,0,0.4);
            position: absolute;
            top: 0;
            left: 0;
            z-index: 2;
            pointer-events: none;
        }

        .ai-text-container {
            position: absolute;
            bottom: 85px;
            left: 0;
            width: 100%;
            text-align: center;
            z-index: 3;
            padding: 0 20px;
        }

        .ai-text {
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.4;
        }

        .ai-action-buttons {
            position: absolute;
            bottom: 3px;
            left: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 3px;
            padding: 0 20px;
            z-index: 3;
        }

        .ai-action-btn {
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .ai-primary-btn {
            background: linear-gradient(135deg, #002fff 0%, #060a1c 100%);
            color: white;
        }

        .ai-secondary-btn {
            background: rgb(89, 0, 255);
            color: white;
            border: 2px solid #000000;
        }

        .ai-primary-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .ai-secondary-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
        }

        .play-icon {
            margin-left: 8px;
            animation: blinkPlay 2s infinite;
            display: inline-block;
        }

        @keyframes blinkPlay {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0.3; }
        }

        .typing-cursor {
            display: inline-block;
            width: 2px;
            height: 1em;
            background: #fff;
            margin-left: 2px;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        /* MOBILEWISE OVERLAY STYLES */
        .mobilewise-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 9998;
            display: none;
            backdrop-filter: blur(5px);
        }

        .mobilewise-interface {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 95vw;
            max-width: 900px;
            height: 85vh;
            background: white;
            border-radius: 20px;
            z-index: 9999;
            display: none;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .mobilewise-close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #002fff;
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 10000;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(0, 47, 255, 0.3);
            transition: all 0.3s ease;
        }

        .mobilewise-close-btn:hover {
            background: #060a1c;
            transform: scale(1.1);
        }

        /* RESPONSIVE DESIGN */
        @media (max-width: 768px) {
            .hero h1 {
                font-size: 2.2rem;
            }

            .stats {
                font-size: 1.1rem;
            }

            .subtitle {
                font-size: 1.5rem;
            }

            .audit-form {
                padding: 30px 20px;
            }

            .url-input {
                padding: 18px 20px;
                font-size: 1rem;
            }

            .analyze-btn {
                padding: 18px;
                font-size: 1rem;
            }

            .benefits {
                flex-direction: column;
                align-items: center;
                gap: 15px;
            }

            .ai-button-container {
                bottom: 15px;
                right: 15px;
            }

            .ai-button-wrapper {
                width: 280px;
            }

            .ai-text {
                font-size: 13px;
                padding: 10px 14px;
            }
        }

        @media (max-width: 480px) {
            .hero h1 {
                font-size: 1.8rem;
            }

            .header-background {
                padding: 60px 0 40px;
            }

            .ai-button-wrapper {
                width: 260px;
            }

            .ai-text-container {
                bottom: 80px;
            }
        }
    </style>
</head>
<body>
    <!-- Full-width header with your image as background -->
    <div class="header-background">
        <div class="container">
            <div class="header-content">
                <!-- Hero Section -->
                <header class="hero">
                    <h1>Is your mobile site costing you.. <span class="highlight">SALES LEADS?</span></h1>
                    <p class="stats">Most businesses lose <strong>70% of mobile visitors</strong> due to poor mobile experience</p>
                    <div class="subtitle">
                        <h2>Get Your FREE Mobile Conversion Score!</h2>
                    </div>
                </header>

                <!-- Audit Form -->
                <section class="audit-form">
                    <div class="form-container">
                        <input 
                            type="url" 
                            id="websiteUrl" 
                            placeholder="Enter your website URL (e.g., https://yoursite.com)" 
                            class="url-input"
                        >
                        <button id="analyzeBtn" class="analyze-btn">
                            🔍 ANALYZE MOBILE WEBSITE
                        </button>
                    </div>
                </section>

                <!-- Benefits -->
                <section class="benefits-section">
                    <div class="benefits">
                        <div class="benefit">✓ Results in 30 seconds</div>
                        <div class="benefit">✓ See what's hurting your conversions</div>
                        <div class="benefit">✓ Get actionable solutions</div>
                    </div>
                </section>
            </div>
        </div>
    </div>

    <!-- Rest of your content can go here if needed -->
    <div class="main-content">
        <div class="container">
            <!-- Additional content can go here -->
        </div>
    </div>

    <!-- Footer Section -->
    <footer class="main-footer">
        <div class="footer-container">
            <img src="https://odetjszursuaxpapfwcy.supabase.co/storage/v1/object/public/form-assets/logos/logo_5f42f026-051a-42c7-833d-375fcac74252_1761017228936_footer2.jpg" 
                 alt="Mobile-Wise AI Footer" 
                 class="footer-image">
        </div>
    </footer>

    <!-- MOBILEWISE AI VIDEO BUTTON -->
    <div class="ai-button-container" id="aiButton">
        <div class="ai-button-wrapper">
            <video class="ai-video" autoplay muted playsinline id="avatarVideo">
                <source src="https://odetjszursuaxpapfwcy.supabase.co/storage/v1/object/public/video-avatars/video_avatar_1764286430873.mp4" type="video/mp4">
            </video>
            
            <div class="ai-text-container">
                <div class="ai-text" id="aiMessage"></div>
            </div>
            
            <div class="ai-action-buttons">
                <button class="ai-action-btn ai-primary-btn" id="getAssistanceBtn">
                    Get AI Assistance <span class="play-icon">▶</span>
                </button>
                <button class="ai-action-btn ai-secondary-btn" id="justBrowsingBtn">
                    Just Browsing 👉
                </button>
            </div>
            
            <img src="https://odetjszursuaxpapfwcy.supabase.co/storage/v1/object/public/form-assets/logos/logo_5f42f026-051a-42c7-833d-375fcac74252_1764359060407_player3.png" 
                 class="ai-button-overlay" 
                 alt="MobileWise AI Assistant">
        </div>
    </div>

    <!-- MOBILEWISE AI OVERLAY SYSTEM -->
    <div class="mobilewise-overlay" id="mobilewiseOverlay"></div>
    
    <div class="mobilewise-interface" id="mobilewiseVoiceInterface">
        <button class="mobilewise-close-btn" id="mobilewiseCloseBtn">×</button>
        <iframe id="voiceChatIframe" 
                src="" 
                style="width: 100%; height: 100%; border: none; border-radius: 20px;" 
                allow="microphone; camera"
                title="MobileWise AI Voice Assistant">
        </iframe>
    </div>

    <script>
        // Mobile Audit Form Functionality
        document.getElementById('analyzeBtn').addEventListener('click', function() {
            const url = document.getElementById('websiteUrl').value.trim();
            
            if (!url) {
                alert('Please enter your website URL');
                document.getElementById('websiteUrl').focus();
                return;
            }
            
            // Basic URL validation
            try {
                new URL(url);
            } catch (e) {
                alert('Please enter a valid URL starting with http:// or https://');
                return;
            }
            
            // Show loading state
            const originalText = this.innerHTML;
            this.innerHTML = '🔍 ANALYZING...';
            this.disabled = true;
            
            // Simulate analysis (replace with actual API call)
            setTimeout(() => {
                alert(`Analysis complete for: ${url}\n\nMobileWise AI is now reviewing your site for mobile optimization opportunities. Our AI assistant can help explain the results!`);
                this.innerHTML = originalText;
                this.disabled = false;
                
                // Show AI assistant button if not already visible
                const aiButton = document.getElementById('aiButton');
                aiButton.classList.add('show');
                
                // Auto-type AI message
                typeText(document.getElementById('aiMessage'), 
                        "I can help you understand your mobile audit results! Tap 'Get AI Assistance' for personalized guidance.");
            }, 2000);
        });

        // AI Video Assistant Functionality
        document.addEventListener('DOMContentLoaded', function() {
            const aiButton = document.getElementById('aiButton');
            const getAssistanceBtn = document.getElementById('getAssistanceBtn');
            const justBrowsingBtn = document.getElementById('justBrowsingBtn');
            const aiMessage = document.getElementById('aiMessage');
            const avatarVideo = document.getElementById('avatarVideo');
            
            // Freeze video at end instead of looping
            avatarVideo.addEventListener('ended', function() {
                this.pause();
            });
            
            // Show AI button after delay
            setTimeout(function() {
                aiButton.classList.add('show');
                
                // Start typing animation
                setTimeout(() => {
                    typeText(aiMessage, "Hi! I'm your MobileWise AI Assistant. Need help with your mobile site or audit?");
                }, 500);
            }, 1500);
            
            // Get AI Assistance Button
            getAssistanceBtn.addEventListener('click', async function(e) {
                e.preventDefault();
                
                const originalText = getAssistanceBtn.innerHTML;
                getAssistanceBtn.innerHTML = '🎤 Opening AI Assistant...';
                getAssistanceBtn.disabled = true;
                
                try {
                    // Get microphone permission
                    const stream = await navigator.mediaDevices.getUserMedia({ 
                        audio: {
                            echoCancellation: true,
                            noiseSuppression: true,
                            autoGainControl: true
                        } 
                    });
                    
                    stream.getTracks().forEach(track => track.stop());
                    localStorage.setItem('micPermissionGranted', 'true');
                    
                    // Generate voice chat URL
                    const timestamp = Date.now();
                    const voiceChatUrl = `https://smartaivoicebot.netlify.app/voice-chat-fusion-instant?autoStartVoice=true&mobilewiseMode=true&timestamp=${timestamp}`;
                    
                    // Show overlay
                    document.getElementById('mobilewiseOverlay').style.display = 'block';
                    document.getElementById('mobilewiseVoiceInterface').style.display = 'block';
                    document.getElementById('voiceChatIframe').src = voiceChatUrl;
                    
                    // Reset button
                    setTimeout(() => {
                        getAssistanceBtn.innerHTML = originalText;
                        getAssistanceBtn.disabled = false;
                    }, 1000);
                    
                } catch (error) {
                    console.error("Microphone permission denied:", error);
                    getAssistanceBtn.innerHTML = '⚠️ Opening without mic...';
                    
                    // Open without microphone permission
                    const voiceChatUrl = `https://smartaivoicebot.netlify.app/voice-chat-fusion-instant?mobilewiseMode=true`;
                    
                    document.getElementById('mobilewiseOverlay').style.display = 'block';
                    document.getElementById('mobilewiseVoiceInterface').style.display = 'block';
                    document.getElementById('voiceChatIframe').src = voiceChatUrl;
                    
                    setTimeout(() => {
                        getAssistanceBtn.innerHTML = originalText;
                        getAssistanceBtn.disabled = false;
                    }, 2000);
                }
            });
            
            // Just Browsing Button
            justBrowsingBtn.addEventListener('click', function() {
                aiButton.style.transform = 'translateX(100px)';
                aiButton.style.opacity = '0';
                
                setTimeout(() => {
                    aiButton.classList.remove('show');
                }, 300);
            });
        });
        
        // Text typing animation
        function typeText(element, text, speed = 50) {
            element.innerHTML = '';
            let i = 0;
            
            function type() {
                if (i < text.length) {
                    element.innerHTML = text.substring(0, i + 1) + '<span class="typing-cursor"></span>';
                    i++;
                    setTimeout(type, speed);
                } else {
                    element.innerHTML = text;
                }
            }
            type();
        }
        
        // Overlay functionality
        function closeMobilewiseOverlay() {
            document.getElementById('mobilewiseOverlay').style.display = 'none';
            document.getElementById('mobilewiseVoiceInterface').style.display = 'none';
            
            const iframe = document.getElementById('voiceChatIframe');
            iframe.src = '';
            
            // Show AI button again
            const aiButton = document.getElementById('aiButton');
            aiButton.classList.add('show');
        }
        
        // Close button event
        document.getElementById('mobilewiseCloseBtn').addEventListener('click', closeMobilewiseOverlay);
        
        // Overlay click to close
        document.getElementById('mobilewiseOverlay').addEventListener('click', closeMobilewiseOverlay);
        
        // Escape key to close
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && 
                document.getElementById('mobilewiseOverlay').style.display === 'block') {
                closeMobilewiseOverlay();
            }
        });
        
        // Prevent iframe clicks from closing overlay
        document.getElementById('mobilewiseVoiceInterface').addEventListener('click', function(e) {
            e.stopPropagation();
        });
    </script>
</body>
</html>
