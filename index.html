<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Mobile Audit - Is Your Mobile Site Costing You Sales?</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Your Logo Image -->
        <div class="logo-container">
            <img src="https://odetjszursuaxpapfwcy.supabase.co/storage/v1/object/public/form-assets/logos/logo_5f42f026-051a-42c7-833d-375fcac74252_1760861063523_lp-image.PNG" 
                 alt="Mobile Audit" 
                 class="logo">
        </div>

        <!-- Hero Section -->
        <header class="hero">
            <h1>Is Your Mobile Site Costing You <span class="highlight">Sales?</span></h1>
            <p class="subtitle">Get Your FREE Mobile Conversion Score</p>
            <p class="stats">Most businesses lose <strong>70% of mobile visitors</strong> due to poor mobile experience</p>
        </header>

        <!-- Audit Form -->
        <section class="audit-form">
            <div class="form-container">
                <input 
                    type="url" 
                    id="websiteUrl" 
                    placeholder="Enter your website URL (e.g., https://yoursite.com)" 
                    class="url-input"
                >
                <button id="analyzeBtn" class="analyze-btn">
                    🔍 ANALYZE MY SITE
                </button>
            </div>
        </section>

        <!-- Benefits -->
        <section class="benefits-section">
            <div class="benefits">
                <div class="benefit">✓ Results in 30 seconds</div>
                <div class="benefit">✓ See what's hurting your conversions</div>
                <div class="benefit">✓ Get actionable solutions</div>
            </div>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
