<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MobileWise AI Assistant</title>
    <style>
        /* RESET & BASE */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: transparent;
            width: 497px;
            height: 533px;
            overflow: hidden;
            position: relative;
        }

        /* MAIN CONTAINER - EXACT 497x533 */
        .ai-interface-container {
            width: 497px;
            height: 533px;
            position: relative;
            overflow: hidden;
        }

        /* VIDEO BACKGROUND */
        .ai-video-background {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 20px;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* VIDEO WINDOW (transparent area in overlay) */
        .ai-video-window {
            position: absolute;
            width: 280px;
            height: 210px;
            top: 120px;
            left: 110px;
            z-index: 2;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
        }

        .ai-video-window video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* TEXT AREA */
        .ai-text-container {
            position: absolute;
            bottom: 180px;
            left: 40px;
            right: 40px;
            z-index: 3;
            text-align: center;
        }

        .ai-text {
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 14px 18px;
            border-radius: 12px;
            font-size: 15px;
            line-height: 1.4;
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* BUTTONS */
        .ai-action-buttons {
            position: absolute;
            bottom: 85px;
            left: 40px;
            right: 40px;
            z-index: 3;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .ai-action-btn {
            padding: 15px 20px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            font-family: 'Segoe UI', sans-serif;
        }

        .ai-primary-btn {
            background: linear-gradient(135deg, #002fff 0%, #060a1c 100%);
            color: white;
            box-shadow: 0 6px 20px rgba(0, 47, 255, 0.3);
        }

        .ai-secondary-btn {
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            border: 2px solid #002fff;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .ai-primary-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0, 47, 255, 0.4);
        }

        .ai-secondary-btn:hover {
            transform: translateY(-3px);
            background: white;
        }

        /* PLAY ICON ANIMATION */
        .play-icon {
            margin-left: 8px;
            animation: blinkPlay 2s infinite;
        }

        @keyframes blinkPlay {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0.3; }
        }

        /* TYPING CURSOR */
        .typing-cursor {
            display: inline-block;
            width: 2px;
            height: 1em;
            background: white;
            margin-left: 4px;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        /* OVERLAY IMAGE (with transparent video window) */
        .ai-interface-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 4;
            pointer-events: none;
            border-radius: 20px;
        }

        /* HIDDEN ELEMENTS FOR POPUP */
        .mobilewise-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            z-index: 9998;
            display: none;
            backdrop-filter: blur(5px);
        }

        .mobilewise-voice-interface {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90vw;
            max-width: 900px;
            height: 80vh;
            background: white;
            border-radius: 20px;
            z-index: 9999;
            display: none;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4);
        }

        .mobilewise-close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #002fff;
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 10000;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(0, 47, 255, 0.3);
        }

        /* Add to your styles.css */
iframe#mobilewiseAIIframe {
    background: white !important;
    opacity: 1 !important;
    visibility: visible !important;
}

        /* RESPONSIVE (within iframe) */
        @media (max-width: 500px) {
            body {
                width: 100%;
                height: 100%;
            }
            
            .ai-interface-container {
                width: 100%;
                height: 100%;
                border-radius: 0;
            }
        }
    </style>
</head>
<body>
    <!-- MAIN 497x533 INTERFACE -->
    <div class="ai-interface-container">
        <!-- Background video (optional) -->
        <video class="ai-video-background" autoplay muted loop playsinline>
            <source src="https://odetjszursuaxpapfwcy.supabase.co/storage/v1/object/public/video-avatars/background-loop.mp4" type="video/mp4">
        </video>
        
        <!-- Video Window -->
        <div class="ai-video-window">
            <video autoplay muted playsinline id="avatarVideo">
                <source src="https://odetjszursuaxpapfwcy.supabase.co/storage/v1/object/public/video-avatars/video_avatar_1764286430873.mp4" type="video/mp4">
            </video>
        </div>
        
        <!-- Text Area -->
        <div class="ai-text-container">
            <div class="ai-text" id="aiMessage"></div>
        </div>
        
        <!-- Action Buttons -->
        <div class="ai-action-buttons">
            <button class="ai-action-btn ai-primary-btn" id="getAssistanceBtn">
                Get AI Assistance <span class="play-icon">▶</span>
            </button>
            <button class="ai-action-btn ai-secondary-btn" id="justBrowsingBtn">
                Just Browsing 👉
            </button>
        </div>
        
        <!-- Overlay Image (with transparent video window cutout) -->
        <img src="https://odetjszursuaxpapfwcy.supabase.co/storage/v1/object/public/form-assets/logos/logo_5f42f026-051a-42c7-833d-375fcac74252_1764359060407_player3.png" 
             class="ai-interface-overlay" 
             alt="MobileWise AI Interface">
    </div>

    <!-- POPUP OVERLAY SYSTEM -->
    <div class="mobilewise-overlay" id="mobilewiseOverlay"></div>
    
    <div class="mobilewise-voice-interface" id="mobilewiseVoiceInterface">
        <button class="mobilewise-close-btn" id="mobilewiseCloseBtn">×</button>
        <iframe id="voiceChatIframe" 
                src="" 
                style="width: 100%; height: 100%; border: none; border-radius: 20px;" 
                allow="microphone; camera"
                title="MobileWise AI Voice Assistant">
        </iframe>
    </div>

    <script>
        // DOM Elements
        const aiMessage = document.getElementById('aiMessage');
        const getAssistanceBtn = document.getElementById('getAssistanceBtn');
        const justBrowsingBtn = document.getElementById('justBrowsingBtn');
        const avatarVideo = document.getElementById('avatarVideo');
        
        // Text Typing Animation
        function typeText(element, text, speed = 50) {
            element.innerHTML = '';
            let i = 0;
            
            function type() {
                if (i < text.length) {
                    element.innerHTML = text.substring(0, i + 1) + '<span class="typing-cursor"></span>';
                    i++;
                    setTimeout(type, speed);
                } else {
                    element.innerHTML = text;
                }
            }
            type();
        }
        
        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            // Freeze video at end
            avatarVideo.addEventListener('ended', function() {
                this.pause();
            });
            
            // Start typing animation after delay
            setTimeout(() => {
                typeText(aiMessage, "Hi! I'm your MobileWise AI Assistant. Need help with your mobile site or audit?");
            }, 1000);
            
            // Get AI Assistance Button
            getAssistanceBtn.addEventListener('click', async function(e) {
                e.preventDefault();
                
                const originalText = getAssistanceBtn.innerHTML;
                getAssistanceBtn.innerHTML = '🎤 Opening AI Assistant...';
                getAssistanceBtn.disabled = true;
                
                try {
                    // Get microphone permission
                    const stream = await navigator.mediaDevices.getUserMedia({ 
                        audio: {
                            echoCancellation: true,
                            noiseSuppression: true,
                            autoGainControl: true
                        } 
                    });
                    
                    stream.getTracks().forEach(track => track.stop());
                    
                    // Generate voice chat URL
                    const timestamp = Date.now();
                    const voiceChatUrl = `https://smartaivoicebot.netlify.app/voice-chat-fusion-instant?autoStartVoice=true&mobilewiseMode=true&timestamp=${timestamp}`;
                    
                    // Show overlay - communicate with parent window
                    window.parent.postMessage({
                        type: 'OPEN_MOBILEWISE_OVERLAY',
                        url: voiceChatUrl
                    }, '*');
                    
                    // Reset button
                    setTimeout(() => {
                        getAssistanceBtn.innerHTML = originalText;
                        getAssistanceBtn.disabled = false;
                    }, 1000);
                    
                } catch (error) {
                    console.error("Microphone permission denied:", error);
                    getAssistanceBtn.innerHTML = '⚠️ Opening without mic...';
                    
                    // Open without microphone permission
                    const voiceChatUrl = `https://smartaivoicebot.netlify.app/voice-chat-fusion-instant?mobilewiseMode=true`;
                    
                    window.parent.postMessage({
                        type: 'OPEN_MOBILEWISE_OVERLAY',
                        url: voiceChatUrl
                    }, '*');
                    
                    setTimeout(() => {
                        getAssistanceBtn.innerHTML = originalText;
                        getAssistanceBtn.disabled = false;
                    }, 2000);
                }
            });
            
            // Just Browsing Button
            justBrowsingBtn.addEventListener('click', function() {
                // Hide the iframe (communicate with parent)
                window.parent.postMessage({
                    type: 'HIDE_MOBILEWISE_IFRAME'
                }, '*');
            });
        });
    </script>
</body>
</html>
